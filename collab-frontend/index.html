<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Inline data-URI favicon. The browser requests /favicon.ico automatically when no icon
      is declared, and that request was the single 404 in the console on load. Inlining it
      keeps the fix self-contained with no extra asset to serve. Amber on warm black, square
      corners — per the SIGNAL design system.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050505'/%3E%3Crect x='6' y='6' width='9' height='9' fill='%23ffb000'/%3E%3Crect x='17' y='17' width='9' height='9' fill='%2398928a'/%3E%3C/svg%3E"
    />
    <meta name="color-scheme" content="dark" />
    <title>Collaborative Whiteboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
