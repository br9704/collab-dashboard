name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first: a queue of stale runs helps nobody.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Hocuspocus 4 requires Node 22+.
          node-version: 22
          cache: npm

      # `npm ci` needs the lockfile to match; the workspace root installs both packages.
      - name: Install
        run: npm ci

      - name: Build the frontend
        run: npm run build

      # Unit tests: the role matrix, the durable store, the client permission model,
      # the shape-recognition geometry, and the CRDT document model.
      - name: Unit tests
        run: npm test --workspaces --if-present

  smoke:
    name: end-to-end smoke
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The integration suite starts the real server in-process on an ephemeral port and
      # drives it over a real socket. It pins THE regression — session state must come from
      # the acknowledgement, never from the broadcast that precedes it.
      - name: Session integration tests
        run: npm test --workspace collab-backend

      - name: Health check against a real process
        run: |
          npm run start --workspace collab-backend &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:3001/health | tee /dev/stderr | grep -q '"status":"ok"'
          kill $SERVER_PID
